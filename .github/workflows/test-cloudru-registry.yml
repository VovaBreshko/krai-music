name: Test Cloud.ru registry push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Cloud.ru
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.CR_URI }}
          username: ${{ secrets.EVO_CR_LOGIN }}
          password: ${{ secrets.EVO_CR_PWD }}

      - name: Push a tiny test image
        env:
          CR_URI: ${{ vars.CR_URI }}
        run: |
          docker pull hello-world:latest
          docker tag hello-world:latest \
            "$CR_URI/react-site:registry-smoke-test"
          docker push \
            "$CR_URI/react-site:registry-smoke-test"