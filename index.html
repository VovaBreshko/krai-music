<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <script>
    // SPA для GitHub Pages: когда пользователь открывает глубокую ссылку
    // (например, /artists или /radio), сервер отдаёт 404.html, который
    // кладёт исходный URL в sessionStorage и редиректит на главную.
    // Здесь мы восстанавливаем исходный путь клиентски — без повторного 404.
    (function () {
      var redirect = sessionStorage.getItem('redirect')
      if (redirect) {
        sessionStorage.removeItem('redirect')
        history.replaceState(null, '', redirect)
      }
    })()
  </script>
  <link rel="icon" type="image/png" href="%BASE_URL%km_favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#0b0a0b" />

</head>
